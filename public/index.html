
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rental Assistant AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      max-width: 700px;
      margin: 40px auto;
      padding: 16px;
    }

    h1 {
      color: #1f2937;
    }

    #messages {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      min-height: 350px;
      max-height: 500px;
      overflow-y: auto;
      padding: 16px;
      margin-bottom: 16px;
    }

    .message {
      margin: 12px 0;
      padding: 14px 16px;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.55;
    }

    .assistant {
      background: #f3f4f6;
    }

    .assistant a {
      color: #2563eb;
      text-decoration: underline;
      font-weight: 600;
    }

    .user {
      background: #dbeafe;
    }

    form {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px;
      min-width: 0;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <h1>Rental Assistant AI</h1>
  <p>Ask about available properties, rental terms, or showing times.</p>

  <div id="messages" aria-live="polite">
    <div class="message assistant">
      Hello! I'm your rental assistant.
      How can I help you today?
    </div>
  </div>

  <form id="chatForm">
    <input
      id="messageInput"
      placeholder="Ask about a rental property..."
      maxlength="2000"
      required
    >
    <button id="sendButton" type="submit">Send</button>
  </form>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const button = document.getElementById("sendButton");
    let previousResponseId =
    sessionStorage.getItem("rentalAssistantResponseId");

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = "message " + role;

      // Convert Markdown-style links into plain URLs first.
      const normalizedText = String(text).replace(
        /\[\**(https?:\/\/[^\]\*]+)\**\]\((https?:\/\/[^)]+)\)/g,
        "$2"
      );

      const urlRegex = /(https?:\/\/[^\s]+)/g;
      const parts = normalizedText.split(urlRegex);

      parts.forEach(part => {
        if (/^https?:\/\//.test(part)) {
          const link = document.createElement("a");

          link.href = part;
          link.textContent = part;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          div.appendChild(link);
        } else {
          div.appendChild(
            document.createTextNode(part)
          );
        }
      });

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const question = input.value.trim();
      if (!question) return;

      addMessage(question, "user");
      input.value = "";
      button.disabled = true;

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: question,
            previousResponseId
          })
        });

        if (!response.ok) {
          throw new Error("Request failed");
        }

        const data = await response.json();

        if (data.responseId) {
          previousResponseId = data.responseId;

          sessionStorage.setItem(
            "rentalAssistantResponseId",
            previousResponseId
          );
        }

        addMessage(data.answer, "assistant");
      } catch (error) {
        addMessage(
          "Sorry, something went wrong. Please try again.",
          "assistant"
        );
      } finally {
        button.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
